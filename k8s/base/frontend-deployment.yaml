apiVersion: apps/v1
kind: Deployment
metadata:
  name: redthread-frontend
  labels:
    app: redthread-frontend
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: redthread-frontend
  template:
    metadata:
      labels:
        app: redthread-frontend
        tier: frontend
    spec:
      containers:
      - name: redthread-frontend
        image: your-registry.azurecr.io/redthread-frontend:latest
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: NEXT_PUBLIC_API_URL
          valueFrom:
            configMapKeyRef:
              name: redthread-config
              key: api-url
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: redthread-frontend
  labels:
    app: redthread-frontend
spec:
  type: ClusterIP
  ports:
  - port: 3000
    targetPort: 3000
    protocol: TCP
    name: http
  selector:
    app: redthread-frontend
