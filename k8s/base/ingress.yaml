apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: redthread-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - redthread.example.com
    - api.redthread.example.com
    secretName: redthread-tls
  rules:
  - host: redthread.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: redthread-frontend
            port:
              number: 3000
  - host: api.redthread.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: redthread-backend
            port:
              number: 8000
