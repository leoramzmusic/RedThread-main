apiVersion: apps/v1
kind: Deployment
metadata:
  name: redthread-backend
  labels:
    app: redthread-backend
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: redthread-backend
  template:
    metadata:
      labels:
        app: redthread-backend
        tier: backend
    spec:
      containers:
      - name: redthread-backend
        image: your-registry.azurecr.io/redthread-backend:latest
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: redthread-config
              key: environment
        - name: MONGODB_URL
          valueFrom:
            secretKeyRef:
              name: redthread-secrets
              key: mongodb-url
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: redthread-config
              key: redis-host
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: redthread-secrets
              key: secret-key
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: redthread-backend
  labels:
    app: redthread-backend
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: redthread-backend
