apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: staging

resources:
- ../../base/backend-deployment.yaml
- ../../base/frontend-deployment.yaml
- ../../base/mongodb-statefulset.yaml
- ../../base/configmap.yaml
- ../../base/ingress.yaml

configMapGenerator:
- name: redthread-config
  behavior: merge
  literals:
  - environment=staging
  - api-url=http://api-staging.redthread.example.com

replicas:
- name: redthread-backend
  count: 2
- name: redthread-frontend
  count: 2

images:
- name: your-registry.azurecr.io/redthread-backend
  newTag: staging-latest
- name: your-registry.azurecr.io/redthread-frontend
  newTag: staging-latest
