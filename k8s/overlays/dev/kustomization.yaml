apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dev

resources:
- ../../base/backend-deployment.yaml
- ../../base/frontend-deployment.yaml
- ../../base/mongodb-statefulset.yaml
- ../../base/configmap.yaml
- ../../base/ingress.yaml

configMapGenerator:
- name: redthread-config
  behavior: merge
  literals:
  - environment=dev
  - api-url=http://api-dev.redthread.example.com

replicas:
- name: redthread-backend
  count: 1
- name: redthread-frontend
  count: 1

images:
- name: your-registry.azurecr.io/redthread-backend
  newTag: dev-latest
- name: your-registry.azurecr.io/redthread-frontend
  newTag: dev-latest
