name: Copilot Task Generation
on:
  issues:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write
  copilot-requests: write

jobs:
  generate:
    if: github.event.label.name == 'task'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Instalar Copilot CLI
        run: npm install -g @github/copilot

      - name: Generar cambios con Copilot
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          copilot -p "Implementa en este repositorio la tarea del issue #${ISSUE_NUMBER}: ${ISSUE_TITLE}. Contexto: ${ISSUE_BODY}. Haz los cambios de codigo necesarios y ejecuta las pruebas del proyecto." \
            --allow-tool='write, shell(npm:*), shell(npx:*), shell(git:*), shell(python:*), shell(pytest:*)' \
            --no-ask-user

      - name: Crear Pull Request
        uses: peter-evans/create-pull-request@v6
        continue-on-error: true
        with:
          branch: copilot/issue-${{ github.event.issue.number }}
          delete-branch: true
          title: "🤖 Copilot: ${{ github.event.issue.title }}"
          body: |
            PR generado automáticamente para el issue #${{ github.event.issue.number }}.

            Closes #${{ github.event.issue.number }}.

            > ⚠️ Revisa este PR antes de mergear. Lo generó una IA sin revisión humana.
          add-paths: |
            ./
          labels: copilot-generated
          commit-message: "🤖 Copilot: ${{ github.event.issue.title }}"