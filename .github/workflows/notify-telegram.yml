name: Notify Telegram
on:
  pull_request:
    types: [opened]

jobs:
  notify:
    if: contains(github.event.pull_request.labels.*.name, 'copilot-generated')
    runs-on: ubuntu-latest
    steps:
      - name: Extraer numero de issue del body
        id: issue
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          NUMBER=$(printf '%s' "$PR_BODY" | grep -oE '#[0-9]+' | head -n1 | tr -d '#')
          echo "number=${NUMBER:-n/a}" >> "$GITHUB_OUTPUT"

      - name: Notificar por Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          PR_TITLE="${{ github.event.pull_request.title }}"
          PR_URL="${{ github.event.pull_request.html_url }}"
          ISSUE_NUMBER="${{ steps.issue.outputs.number }}"
          MSG="🤖 Copilot genero PR #${PR_NUMBER} para el issue #${ISSUE_NUMBER}
          ${PR_TITLE}
          ${PR_URL}"
          printf '%s' "$MSG" | curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" --data-urlencode "text@-"