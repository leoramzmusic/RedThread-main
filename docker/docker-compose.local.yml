version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: redthread-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: redthread
    volumes:
      - mongodb_data:/data/db
    networks:
      - redthread-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: redthread-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - redthread-network

  # Kafka Event Bus (KRaft single-node)
  kafka:
    image: apache/kafka:3.7.0
    container_name: redthread-kafka
    restart: always
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: redthread-cluster
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    networks:
      - redthread-network

  # API Gateway
  gateway:
    image: nginx:alpine
    container_name: redthread-gateway
    restart: always
    ports:
      - "8000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth-service
      - profile-service
      - discovery-service
      - chat-service
      - radar-service
      - premium-service
      - options-service
      - settings-service
    networks:
      - redthread-network

  # Auth Service
  auth-service:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: redthread-auth-service
    restart: always
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
      - MONGODB_DB_NAME=redthread
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ENVIRONMENT=local
      - DEBUG=true
    volumes:
      - ../backend:/app
    depends_on:
      - mongodb
      - redis
    networks:
      - redthread-network
    command: gunicorn src.services.auth.main:app --workers 2 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000

  # Profile Service
  profile-service:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: redthread-profile-service
    restart: always
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
      - MONGODB_DB_NAME=redthread
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ENVIRONMENT=local
      - DEBUG=true
    volumes:
      - ../backend:/app
    depends_on:
      - mongodb
      - redis
    networks:
      - redthread-network
    command: gunicorn src.services.profiles.main:app --workers 2 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000

  # Discovery Service
  discovery-service:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: redthread-discovery-service
    restart: always
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
      - MONGODB_DB_NAME=redthread
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ENVIRONMENT=local
      - DEBUG=true
    volumes:
      - ../backend:/app
    depends_on:
      - mongodb
      - redis
    networks:
      - redthread-network
    command: gunicorn src.services.discovery.main:app --workers 2 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000

  # Chat Service
  chat-service:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: redthread-chat-service
    restart: always
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
      - MONGODB_DB_NAME=redthread
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ENVIRONMENT=local
      - DEBUG=true
    volumes:
      - ../backend:/app
    depends_on:
      - mongodb
      - redis
    networks:
      - redthread-network
    command: gunicorn src.services.chat.main:app --workers 2 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000

  # Radar Service
  radar-service:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: redthread-radar-service
    restart: always
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
      - MONGODB_DB_NAME=redthread
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ENVIRONMENT=local
      - DEBUG=true
    volumes:
      - ../backend:/app
    depends_on:
      - mongodb
      - redis
    networks:
      - redthread-network
    command: gunicorn src.services.radar.main:app --workers 1 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000

  # Premium Service
  premium-service:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: redthread-premium-service
    restart: always
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
      - MONGODB_DB_NAME=redthread
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ENVIRONMENT=local
      - DEBUG=true
    volumes:
      - ../backend:/app
    depends_on:
      - mongodb
      - redis
    networks:
      - redthread-network
    command: gunicorn src.services.premium.main:app --workers 1 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000

  # Options Service
  options-service:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: redthread-options-service
    restart: always
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
      - MONGODB_DB_NAME=redthread
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ENVIRONMENT=local
      - DEBUG=true
    volumes:
      - ../backend:/app
    depends_on:
      - mongodb
      - redis
    networks:
      - redthread-network
    command: gunicorn src.services.options.main:app --workers 1 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000

  # Settings Service
  settings-service:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: redthread-settings-service
    restart: always
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
      - MONGODB_DB_NAME=redthread
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ENVIRONMENT=local
      - DEBUG=true
    volumes:
      - ../backend:/app
    depends_on:
      - mongodb
      - redis
    networks:
      - redthread-network
    command: gunicorn src.services.settings.main:app --workers 1 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000

  # Frontend
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: redthread-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NODE_ENV=development
    volumes:
      - ../frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - gateway
    networks:
      - redthread-network
    command: npm run dev

volumes:
  mongodb_data:
  redis_data:


networks:
  redthread-network:
    driver: bridge
