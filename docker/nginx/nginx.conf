events {
    worker_connections 1024;
}

http {
    upstream auth_service {
        server auth-service:8000;
    }

    upstream profile_service {
        server profile-service:8000;
    }

    upstream discovery_service {
        server discovery-service:8000;
    }

    upstream chat_service {
        server chat-service:8000;
    }

    upstream radar_service {
        server radar-service:8000;
    }

    upstream premium_service {
        server premium-service:8000;
    }

    upstream options_service {
        server options-service:8000;
    }

    upstream settings_service {
        server settings_service:8000;
    }

    server {
        listen 80;

        location /auth {
            proxy_pass http://auth_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /profiles {
            proxy_pass http://profile_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /discovery {
            proxy_pass http://discovery_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /chat {
            proxy_pass http://chat_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            
            # WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        location /radar {
            proxy_pass http://radar_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /premium {
            proxy_pass http://premium_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /options {
            proxy_pass http://options_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /settings {
            proxy_pass http://settings_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        
        # Health check
        location /health {
            return 200 '{"status":"healthy"}';
            add_header Content-Type application/json;
        }
    }
}
